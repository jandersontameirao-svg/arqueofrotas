# ArqueoFrotas — nginx server block
# Copie para /etc/nginx/sites-available/arqueofrotas.conf e crie o symlink em
# /etc/nginx/sites-enabled/. O certbot --nginx cuidará do bloco 443/HTTPS.
#
#   sudo ln -s /etc/nginx/sites-available/arqueofrotas.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d arqueofrotas.sigpa.com.br --redirect

server {
    listen 80;
    listen [::]:80;
    server_name arqueofrotas.sigpa.com.br;

    # Uploads/evidências podem ser grandes (o app aceita até ~50MB no body).
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # Necessário para o cookie de sessão "secure" ser setado corretamente.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a WebSocket/HMR (inofensivo em produção).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
    }
}
